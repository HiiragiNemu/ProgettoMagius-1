name: Publish faithful severe translation review 3313
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-story-quality-3313.yml', 'story-quality/20261001-severe-5109/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-resource-mirror
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s story-quality/20261001-severe-5109 -p 'test_*.py' -v
      - name: Verify fixed source identities and anonymous full assets before opening version gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -u story-quality/20261001-severe-5109/publish_scenario_3313.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scenario-3313-severe-translation-receipt
          path: |
            scenario3313/candidate/story-quality-report.json
            scenario3313/candidate/version_scenario.json
          if-no-files-found: warn
          retention-days: 30
