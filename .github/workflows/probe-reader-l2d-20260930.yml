name: Read-only Reader and L2D diagnostic 20260930
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-reader-l2d-20260930.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Capture public HTTP results without altering release or deployment
        run: |
          python -u - <<'PY'
          import concurrent.futures,hashlib,json,time,urllib.request,urllib.error
          from pathlib import Path
          out=Path('probe');out.mkdir()
          reader='https://magireader.pages.dev';viewer='https://magiaexedralive2dviewer.pages.dev'
          link='/?advRenderer=pixi-v2&bridge=1&story=102303&section=102303-1_riRcZ'
          targets={'reader-release':reader+'/api/adv/release','reader-config':reader+'/api/proofreading/config','reader-index':reader+'/story_index.json','reader-command':reader+'/api/story-json/102303/cn/0','viewer':viewer+link,'viewer-pinned':viewer+link+'&readerVersion=pinned','viewer-root':viewer+'/'}
          def get(item):
              name,url=item;t=time.monotonic();p=out/(name+'.body')
              try:
                  try:r=urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Reader-L2D-ReadOnly-Diagnostic','Accept-Encoding':'identity'}),timeout=65)
                  except urllib.error.HTTPError as e:r=e
                  with r:
                      raw=r.read(20*1024*1024+1);assert len(raw)<=20*1024*1024
                      p.write_bytes(raw);result={'name':name,'url':url,'final_url':r.url,'status':r.status,'seconds':round(time.monotonic()-t,3),'headers':{k:v for k,v in r.headers.items() if k.lower() not in ('set-cookie',)},'sha256':hashlib.sha256(raw).hexdigest(),'size':len(raw)}
                      if len(raw)<18000:
                          try:result['json']=json.loads(raw)
                          except ValueError:result['preview']=raw.decode('utf-8','replace')[:800]
                      return result
              except Exception as e:return {'name':name,'url':url,'error':type(e).__name__+': '+str(e),'seconds':round(time.monotonic()-t,3)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:results=list(pool.map(get,targets.items()))
          (out/'http.json').write_text(json.dumps(results,ensure_ascii=False,indent=2))
          for x in results: print(json.dumps(x,ensure_ascii=False),flush=True)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser diagnostic
        run: |
          mkdir browser-probe && cd browser-probe
          npm init -y >/dev/null
          npm install playwright@1.58.2 --no-audit --no-fund
          npx playwright install chromium --with-deps
      - name: Observe page progress and failed requests for 100 seconds
        run: |
          cd browser-probe
          cat > probe.cjs <<'JS'
          const {chromium}=require('playwright'); const fs=require('node:fs');
          (async()=>{const browser=await chromium.launch({headless:true,args:['--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader']});
          const page=await browser.newPage({viewport:{width:1365,height:900}});const events=[];let total=0;const start=Date.now();
          page.on('console',m=>{if(['error','warning'].includes(m.type()))events.push({kind:'console',type:m.type(),text:m.text(),ms:Date.now()-start})});
          page.on('pageerror',e=>events.push({kind:'pageerror',message:e.message,stack:e.stack}));
          page.on('requestfailed',r=>events.push({kind:'requestfailed',url:r.url(),failure:r.failure(),ms:Date.now()-start}));
          page.on('response',r=>{total++;if(r.status()>=400||r.url().includes('/api/'))events.push({kind:'response',url:r.url(),status:r.status(),ms:Date.now()-start})});
          try{await page.goto('https://magiaexedralive2dviewer.pages.dev/?advRenderer=pixi-v2&bridge=1&story=102303&section=102303-1_riRcZ',{waitUntil:'domcontentloaded',timeout:65000});}catch(e){events.push({kind:'navigation',error:e.message})}
          for(let i=0;i<5;i++){await page.waitForTimeout(20000);events.push({kind:'progress',ms:Date.now()-start,text:(await page.locator('body').innerText().catch(()=>'' )).slice(-12000)});}
          await page.screenshot({path:'../probe/player.png',fullPage:false}).catch(()=>{});
          fs.writeFileSync('../probe/browser.json',JSON.stringify({url:page.url(),totalRequests:total,events},null,2));
          console.log(JSON.stringify({totalRequests:total,failures:events.filter(e=>e.kind!=='progress'),lastProgress:events.filter(e=>e.kind==='progress').slice(-1)},null,2));
          await browser.close();})().catch(e=>{console.error(e);process.exitCode=1;});
          JS
          node probe.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-l2d-probe-20260930
          path: probe/
          retention-days: 7
