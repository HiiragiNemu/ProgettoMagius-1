name: Publish verified Act II scenario batch 3309
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-story-quality-3309.yml'
      - 'story-quality/20260930-08/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-resource-mirror
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact Act II repair fixtures
        run: python -m unittest discover -s story-quality/20260930-08 -p 'test_*.py' -v
      - name: Build, preserve all other runtime files, and anonymously verify before version gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -u story-quality/20260930-08/publish_scenario_3309.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scenario-3309-delivery-receipt
          path: |
            scenario3309/candidate/story-quality-report.json
            scenario3309/candidate/version_scenario.json
          if-no-files-found: warn
          retention-days: 30
