name: Publish verified scenario quality batch 3306
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-story-quality-3306.yml'
      - 'story-quality/20260930-05/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-resource-mirror
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate exact-field and lossless-prefix regressions
        run: |
          python -m unittest discover -s story-quality/20260930-05 -p test_exact_stage.py -v
          python -m py_compile story-quality/20260930-05/*.py
      - name: Build, preserve prior corrections, publish data before version and anonymously verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -u story-quality/20260930-05/publish_scenario_3306.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scenario-3306-delivery-receipt
          path: |
            scenario3306/candidate/story-quality-report.json
            scenario3306/candidate/version_scenario.json
          if-no-files-found: warn
          retention-days: 30
