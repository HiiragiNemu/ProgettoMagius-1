name: Publish verified scenario quality batch 3308
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-story-quality-3308.yml'
      - 'story-quality/20260930-07/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-resource-mirror
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 64 editing tests and 29 original extractor regressions
        run: |
          python -m unittest discover -s story-quality/20260930-07 -p 'test_*.py' -v
          python -m unittest discover -s story-quality/20260930-07/tests -p 'test_*.py' -v
          python -m py_compile story-quality/20260930-07/*.py
      - name: Publish only source-committed repairs, verify all unchanged files and ordinary public URL
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -u story-quality/20260930-07/publish_scenario_3308.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scenario-3308-delivery-receipt
          path: |
            scenario3308/candidate/story-quality-report.json
            scenario3308/candidate/version_scenario.json
          if-no-files-found: warn
          retention-days: 30
