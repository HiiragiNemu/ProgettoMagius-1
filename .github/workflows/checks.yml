name: Resource mirror checks
on:
  push:
    branches: [main]
    paths: ['tools/**', 'tests/**', 'distribution/**', '.github/workflows/checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: node distribution/test-worker.mjs
