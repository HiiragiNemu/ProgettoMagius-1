name: Export public narrator audit input (read only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/export-narrator-audit-input-20260929.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download immutable 3305 package and verify release receipt
        run: |
          python - <<'PY'
          import hashlib,json,urllib.request,zipfile
          from pathlib import Path
          root=Path('narrator-audit-input');root.mkdir()
          def download(url,p):
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'read-only-narrator-audit'}),timeout=180) as r,p.open('wb') as w:
                  for b in iter(lambda:r.read(1024*1024),b''):w.write(b)
          base='https://github.com/HiiragiNemu/ProgettoMagius-1/releases/download/scenario-3305/'
          for name in ('cn_scenario_update.zip','cn_scenario_update_manifest.json','version_scenario.json','manifest.json'):
              download(base+name,root/name)
          for v in range(3301,3306):
              download(f'https://raw.githubusercontent.com/HiiragiNemu/ProgettoMagius-1/main/story-quality/releases/{v}.json',root/f'receipt-{v}.json')
          receipt=json.loads((root/'receipt-3305.json').read_bytes());raw=(root/'cn_scenario_update.zip').read_bytes()
          assert hashlib.sha256(raw).hexdigest()==receipt['package']['sha256']=='0bac26e6944b3589dc46cbbfc01bf1c125cfaa2aa4e26acb6dc5f1d71dfadee9'
          assert len(raw)==receipt['package']['size']
          with zipfile.ZipFile(root/'cn_scenario_update.zip') as z:assert z.testzip() is None
          print('READ_ONLY_3305_SNAPSHOT_VERIFIED',len(raw))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: narrator-audit-input-3305
          path: narrator-audit-input/
          compression-level: 0
          retention-days: 7
